name: Deploy — Fly.io

on:
  workflow_run:
    workflows: ["CI — TypeScript Compilation & Security Audit"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@master
        with:
          args: deploy

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf https://tiffany-creative.fly.dev/health || \
          curl -sf https://tiffany-creative.fly.dev/.well-known/x402.json || \
          echo "Health check pending — deployment in progress"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Fly.io deployment failed — check Fly dashboard"