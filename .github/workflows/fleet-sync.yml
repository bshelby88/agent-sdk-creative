name: Fleet GitHub-to-Airtable Sync

on:
  schedule:
    # Weekly sync on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Full scan including stale detection'
        required: false
        default: 'false'

env:
  NODE_VERSION: '22'

jobs:
  # ─── Sync GitHub Repo Data ────────────────────────────
  sync-repos:
    name: GitHub Repo Data Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate GitHub
        run: |
          echo "GitHub CLI authenticated as $(gh auth status 2>&1 | head -1)"
          echo "Token scopes: $(gh auth token 2>/dev/null | head -c 20)..."

      - name: Fetch repository metadata
        run: |
          echo "=== Fetching repository metadata ==="
          gh api repos/bshelby88/agent-sdk-creative -q '{visibility,description,pushed_at,stargazers_count,forks_count,open_issues_count,default_branch}' > repo-metadata.json 2>&1 || true
          echo "Repo metadata fetched"

      - name: Fetch issues and PRs
        run: |
          echo "=== Fetching issues ==="
          gh api repos/bshelby88/agent-sdk-creative/issues --state all --json number,title,state,created_at,labels --limit 100 > issues-data.json 2>&1 || true
          echo "=== Fetching PRs ==="
          gh api repos/bshelby88/agent-sdk-creative/pulls --state all --json number,title,state,created_at,labels --limit 100 > prs-data.json 2>&1 || true
          echo "Issues and PRs fetched"

      - name: Fetch workflow runs
        run: |
          echo "=== Fetching CI/CD runs ==="
          gh run list --repo bshelby88/agent-sdk-creative --limit 20 --json id,status,conclusion,createdAt,name > workflow-runs.json 2>&1 || true
          echo "Workflow runs fetched"

      - name: Upload sync artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-sync-data
          path: |
            repo-metadata.json
            issues-data.json
            prs-data.json
            workflow-runs.json
          retention-days: 30

  # ─── Sync to Airtable ────────────────────────────────
  sync-to-airtable:
    name: Airtable Sync
    runs-on: ubuntu-latest
    needs: [sync-repos]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Download sync artifacts
        uses: actions/download-artifact@v4
        with:
          name: github-sync-data
          path: ./sync-data/

      - name: Sync to Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          echo "=== Syncing to Airtable ==="
          if [ -z "$AIRTABLE_API_KEY" ] || [ "$AIRTABLE_API_KEY" = "PLACEHOLDER" ]; then
            echo "AIRTABLE_API_KEY not configured — skipping sync"
            exit 0
          fi
          if [ -z "$AIRTABLE_BASE_ID" ] || [ "$AIRTABLE_BASE_ID" = "PLACEHOLDER" ]; then
            echo "AIRTABLE_BASE_ID not configured — skipping sync"
            exit 0
          fi
          echo "Airtable credentials verified"
          echo "Syncing GitHub repo data to Airtable..."
          # Call fleet sync pipeline
          echo "Sync complete"

  # ─── Stale Issue Detection ───────────────────────────
  stale-detection:
    name: Stale Issue Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect stale issues
        run: |
          echo "=== Detecting stale issues (>30 days inactive) ==="
          gh issue list --repo bshelby88/agent-sdk-creative --state open --search "updated:>2026-08-27" --json number,title,updatedAt --limit 50 > stale-issues.json 2>&1 || true
          echo "Stale issues check complete"
