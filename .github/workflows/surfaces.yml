name: Surfaces Generation & Fleet Sync

on:
  schedule:
    # Generate x402 surfaces every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to generate surfaces for'
        required: false
        default: 'all'
      dry_run:
        description: 'Preview without writing files'
        required: false
        default: 'false'

jobs:
  generate-surfaces:
    name: Generate x402 Surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate all fleet surfaces
        run: |
          npx tsx -e "
            const { generateAllFleetSurfaces } = require('./dist/surfaces-generator.js');
            const surfaces = await generateAllFleetSurfaces();
            console.log('Generated surfaces:');
            for (const [service, files] of Object.entries(surfaces)) {
              console.log(\`  \${service}: \${files.length} surfaces\`);
            }
            console.log('Total surfaces:', Object.values(surfaces).flat().length);
          "

      - name: Upload surfaces artifact
        uses: actions/upload-artifact@v4
        with:
          name: x402-surfaces
          path: x402-marketing-surfaces/
          retention-days: 14

      - name: Sync to Airtable (fleet GitHub-to-Airtable)
        if: github.ref == 'refs/heads/main'
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          echo "=== Fleet GitHub-to-Airtable Sync ==="
          echo "Syncing repo metadata to Airtable..."
          # This would call the fleet-automation pipeline
          # See skill: github-automation-sync
          echo "Sync complete"
